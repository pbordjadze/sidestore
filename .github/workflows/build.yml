name: Build source

# Rebuilds source.json when an app entry changes here, and every 30 minutes to
# pick up new builds from the apps whose sources live in their own repos.
# Public repo, so these runs cost no Actions minutes.

on:
  push:
    branches: [main]
    paths: ['apps/**', 'sources.json', 'scripts/**', '.github/workflows/**']
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

concurrency:
  group: build-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Build source.json
        run: python3 scripts/build_source.py
      - name: Commit if it changed
        run: |
          git add source.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git -c user.name="sidestore-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Update source.json"
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            sleep 5
            git pull -q --rebase origin main
          done
          exit 1
